<!DOCTYPE html>
<html>
<head>
  <title>PyVarChart Web UI</title>
</head>
<body>
  <h1>Upload CSV or Excel</h1>
  <form id="upload-form">
    <input type="file" name="file" id="file-input" />
    <button type="submit">Upload</button>
  </form>

  <div id="column-select" style="display:none;">
    <h2>Choose Columns</h2>

    <label>Y-axis Variable:</label>
    <select id="yaxis"></select><br><br>

    <label>X-axis Variables:</label>
    <div id="xaxis-container"></div><br>

    <button id="analyze-btn">Analyze</button>
  </div>

  <div id="plot-container">
    <h2>Output Plot:</h2>
    <img id="plot-img" src="" style="max-width:100%;"/>
  </div>

  <script>
    const uploadForm = document.getElementById('upload-form');
    const fileInput = document.getElementById('file-input');
    const yaxisSelect = document.getElementById('yaxis');
    const columnSelect = document.getElementById('column-select');
    const analyzeBtn = document.getElementById('analyze-btn');
    const plotImg = document.getElementById('plot-img');
    const xaxisContainer = document.getElementById('xaxis-container');

    let fileId = null;

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      const res = await fetch('/upload', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      if (data.error) return alert(data.error);

      fileId = data.file_id;
      const columns = data.columns;

      // Clear previous options
      yaxisSelect.innerHTML = '';
      xaxisContainer.innerHTML = '';

      columns.forEach(col => {
        // Y-axis select
        const yOpt = document.createElement('option');
        yOpt.value = col;
        yOpt.text = col;
        yaxisSelect.appendChild(yOpt);

        // X-axis checkboxes
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = col;
        checkbox.id = `xaxis-${col}`;

        const label = document.createElement('label');
        label.htmlFor = checkbox.id;
        label.innerText = col;

        const wrapper = document.createElement('div');
        wrapper.appendChild(checkbox);
        wrapper.appendChild(label);

        xaxisContainer.appendChild(wrapper);
      });

      columnSelect.style.display = 'block';
    });

    analyzeBtn.addEventListener('click', async () => {
      const yaxis = yaxisSelect.value;

      const xaxisCheckboxes = xaxisContainer.querySelectorAll('input[type="checkbox"]:checked');
      const xaxes = Array.from(xaxisCheckboxes).map(cb => cb.value);

      const config = {
        label_spacing: 0.05,
        str_yaxis_var_name: yaxis,
        lst_xaxis_var_names: xaxes,
        str_legend: null,
        b_jitter_points: true,
        int_boxplots: 1,
        int_marker_size: 8,
        str_marker_theme: "Default",
        str_color_theme: "pvc light",
        int_show_cell_means: 1,
        lst_show_group_means: [],
        int_show_grand_mean: 1,
        int_frame_size_x: 8,
        int_frame_size_y: 6,
        str_title: "Generated Plot"
      };

      const res = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_id: fileId, config: config })
      });

      const data = await res.json();
      if (data.error) return alert(data.error);

      // Show plot
      plotImg.src = data.image_url + "?cachebust=" + new Date().getTime();
    });
  </script>
</body>
</html>
